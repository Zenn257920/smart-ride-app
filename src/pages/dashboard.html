<!doctype html>
<html lang="my">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard - Innovix SharedRide</title>
    <link rel="stylesheet" href="/src/style.css" />
    
    <script>
      (function () {
        const t = localStorage.getItem("smartride_theme") || "light";
        document.documentElement.setAttribute("data-theme", t);
      })();
    </script>
  </head>

  <body>
    <div class="bg-grid"></div>
    <div class="bg-glow bg-glow--1"></div>
    <div class="bg-glow bg-glow--2"></div>
    <nav class="nav-wrapper">
      <div class="nav-inner">
        <a href="/" class="logo">
          <div class="logo-icon">
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="#fff"
              stroke-width="2"
            >
              <rect x="1" y="3" width="15" height="13" rx="2" />
              <path d="M16 8h4l3 4v4h-7V8z" />
              <circle cx="5.5" cy="18.5" r="2.5" />
              <circle cx="18.5" cy="18.5" r="2.5" />
            </svg>
          </div>
          <div>
            <span class="logo-text">Innovix SharedRide</span>
            <span class="logo-sub">Myanmar</span>
          </div>
        </a>
        <div class="nav-links">
          <a href="find-ride.html" class="nav-link">Find Ride</a>
          <a href="ride-requests.html" class="nav-link"> Ride Requests</a>

          <a href="dashboard.html" class="nav-link nav-cta">Dashboard</a>
          <button id="themeToggleBtn" class="theme-toggle" title="Dark Mode">
            🌙
          </button>
          <a href="#" id="logoutBtn" class="nav-link">LogOut</a>
        </div>
        <button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Menu">
          <span></span><span></span><span></span>
        </button>
      </div>
    </nav>
    <div class="container" style="padding: 2rem">
      <div
        id="userInfo"
        class="glass-card animate-fade-in-up"
        style="margin-bottom: 2rem; padding: 1.5rem"
      >
        <div
          style="
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
          "
        >
          <div>
            <h2
              id="userName"
              style="
                font-family: var(--font-heading);
                color: var(--green-dark);
                margin-bottom: 0.5rem;
              "
            >
              Loading...
            </h2>
            <p id="userEmail" style="color: var(--gray)"></p>
          </div>
          <div style="text-align: right">
            <div style="font-size: 0.75rem; color: var(--gray)">Remain Balance</div>
            <div
              style="
                font-family: var(--font-heading);
                font-size: 2rem;
                font-weight: 800;
                color: var(--green);
              "
              id="userBalance"
            >
              0
            </div>
            <div style="font-size: 0.7rem; color: var(--gray)">Kyats</div>
          </div>
        </div>
      </div>
      <div
        style="
          display: grid;
          grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
          gap: 1.5rem;
          margin-bottom: 2rem;
        "
      >
        <a
          href="find-ride.html"
          class="glass-card"
          style="text-decoration: none; text-align: center; padding: 2rem"
        >
          <div style="font-size: 3rem; margin-bottom: 1rem"><i data-lucide="car" style="width:80px;height:80px;"></i></div>
          <h3 style="color: var(--green-dark); margin-bottom: 0.5rem">
            Find Ride
          </h3>
          <p style="color: var(--gray); font-size: 0.85rem">
            Ride with same route Passenger
          </p>
        </a>

        <a
          href="wallet.html"
          class="glass-card"
          style="text-decoration: none; text-align: center; padding: 2rem"
        >
          <div style="font-size: 3rem; margin-bottom: 1rem"><i data-lucide="wallet" style="width:80px;height:80px;"></i></div>
          <h3 style="color: var(--green-dark); margin-bottom: 0.5rem">
            Wallet
          </h3>
          <p style="color: var(--gray); font-size: 0.85rem">
            Depo/Withdraw and Transitions
          </p>
        </a>
        <a
          href="my-rides.html"
          class="glass-card"
          style="text-decoration: none; text-align: center; padding: 2rem"
        >
          <div style="font-size: 3rem; margin-bottom: 1rem"><i data-lucide="notepad-text" style="width:80px;height:80px;"></i></div>
          <h3 style="color: var(--green-dark); margin-bottom: 0.5rem">
            Records
          </h3>
          <p style="color: var(--gray); font-size: 0.85rem">
            My Ride Records
          </p>
        </a>
        <a
          href="ride-requests.html"
          class="glass-card"
          style="text-decoration: none; text-align: center; padding: 2rem"
        >
          <div style="font-size: 3rem; margin-bottom: 1rem"><i data-lucide="map-pinned" style="width:80px;height:80px;"></i></div>
          <h3 style="color: var(--green-dark); margin-bottom: 0.5rem">
            Request Ride
          </h3>
          <p style="color: var(--gray); font-size: 0.85rem">
            Find Driver by requesting ride
          </p>
        </a>
      </div>
      <div class="glass-card">
        <h3
          style="
            font-family: var(--font-heading);
            color: var(--green-dark);
            margin-bottom: 1rem;
          "
        >
          Record
        </h3>
        <div
          style="
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
          "
        >
          <div>
            <div style="font-size: 0.75rem; color: var(--gray)">
              Total Ride
            </div>
            <div
              style="font-size: 1.5rem; font-weight: 700; color: var(--green)"
              id="totalRides"
            >
              0
            </div>
          </div>
          <div>
            <div style="font-size: 0.75rem; color: var(--gray)">
              Money Saved
            </div>
            <div
              style="font-size: 1.5rem; font-weight: 700; color: var(--green)"
              id="totalSaved"
            >
              0
            </div>
          </div>
        </div>
      </div>
    </div>
    <script type="module">
      import { requireAuth, getCurrentUser, logout } from "../js/auth.js";
      import { db } from "../js/database.js";
      import { toggleTheme } from "../js/theme.js";

      document
        .getElementById("themeToggleBtn")
        ?.addEventListener("click", toggleTheme);

      if (!requireAuth()) {
       
      } else {
       
        const user = db.getCurrentUser() || getCurrentUser();

        
        if (user.userType === "driver") {
          window.location.href = "/src/pages/driver-dashboard.html";
        } else {
          document.getElementById("userName").textContent =
            user.name || user.email;
          document.getElementById("userEmail").textContent = user.email;
          document.getElementById("userBalance").textContent =
            user.balance?.toLocaleString() || "0";

          
          const bookings = db.getBookingsByPassenger(user.id) || [];
          document.getElementById("totalRides").textContent = bookings.length;

          let totalSaved = 0;
          bookings.forEach((booking) => {
           
            const origPrice = booking.originalPrice || booking.totalPrice;
            totalSaved += origPrice - booking.totalPrice;
          });
          document.getElementById("totalSaved").textContent =
            totalSaved.toLocaleString() + " Kyats";
        }
      }

      document.getElementById("logoutBtn")?.addEventListener("click", (e) => {
        e.preventDefault();
        logout();
      });
    </script>
    <script>
      
      (function () {
        const btn = document.getElementById("mobileMenuBtn");
        const nav = document.querySelector(".nav-links");
        if (btn && nav) {
          btn.addEventListener("click", function () {
            nav.classList.toggle("active");
            btn.classList.toggle("active");
          });
          nav.querySelectorAll("a").forEach(function (link) {
            link.addEventListener("click", function () {
              nav.classList.remove("active");
              btn.classList.remove("active");
            });
          });
        }
      })();
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
  lucide.createIcons();
</script>
  </body>
</html>
