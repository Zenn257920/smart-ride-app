<!doctype html>
<html lang="my">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ကားစီးမည် - Innovix SmartRide</title>
  <link rel="stylesheet" href="/src/style.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>

<body>
  <div class="bg-grid"></div>
  <div class="bg-glow bg-glow--1"></div>
  <div class="bg-glow bg-glow--2"></div>
  <nav class="nav-wrapper">
    <div class="nav-inner">
      <a href="/" class="logo">
        <div class="logo-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2">
            <rect x="1" y="3" width="15" height="13" rx="2" />
            <path d="M16 8h4l3 4v4h-7V8z" />
            <circle cx="5.5" cy="18.5" r="2.5" />
            <circle cx="18.5" cy="18.5" r="2.5" />
          </svg>
        </div>
        <div>
          <span class="logo-text">Innovix SmartRide</span>
          <span class="logo-sub">Myanmar</span>
        </div>
      </a>
      <div class="nav-links">
        <a href="find-ride.html" class="nav-link nav-cta">ကားစီးမည်</a>
        <a href="offer-ride.html" class="nav-link">ကားမောင်းမည်</a>
        <a href="dashboard.html" class="nav-link">Dashboard</a>
        <a href="#" id="logoutBtn" class="nav-link">ထွက်ရန်</a>
      </div>
    </div>
  </nav>
  <div class="container" style="padding: 2rem;">
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 2rem;">
      <!-- Search Form -->
      <div class="glass-card animate-fade-in-up">
        <h2 style="font-family: var(--font-heading); color: var(--green-dark); margin-bottom: 1.5rem;">🔍 ခရီးစဉ်ရှာမည်
        </h2>
        <form id="searchForm">
          <div class="input-group">
            <label class="input-label">ထွက်ခွာမည့်နေရာ</label>
            <input type="text" id="startLocation" class="input-field" placeholder="e.g. သံလျင်, လှိုင်, ဒဂုံ" required>
          </div>
          <div class="input-group">
            <label class="input-label">ဦးတည်ရာ</label>
            <input type="text" id="endLocation" class="input-field" placeholder="e.g. ဗဟန်း, လမ်းမတော်, ရန်ကင်း"
              required>
          </div>
          <div class="input-group">
            <label class="input-label">ထွက်ခွာမည့်အချိန်</label>
            <input type="datetime-local" id="departureTime" class="input-field" required>
          </div>
          <button type="submit" class="btn-primary" style="width: 100%;">🤖 AI ဖြင့်ရှာမည်</button>
        </form>
      </div>
      <!-- Map -->
      <div class="glass-card animate-fade-in-up animate-delay-2">
        <h3 style="font-family: var(--font-heading); color: var(--green-dark); margin-bottom: 1rem;">🗺️ မြေပုံ</h3>
        <div id="mapClickHint"
          style="margin-bottom: 0.75rem; padding: 0.6rem 1rem; border-radius: 10px; background: var(--green-light); color: var(--green-dark); font-size: 0.78rem; font-weight: 500; display: flex; align-items: center; gap: 0.5rem; opacity: 0; transition: all 0.3s ease; transform: translateY(-4px);">
          <span style="font-size: 1rem;">👆</span>
          <span id="mapClickHintText">မြေပုံပေါ်တွင် နှိပ်၍ နေရာရွေးပါ</span>
        </div>
        <div id="map" class="map-container" style="height: 400px;"></div>
        <div style="margin-top: 1rem; display: flex; gap: 0.5rem;">
          <button id="getCurrentLocation" class="btn-outline" style="font-size: 0.75rem;">📍 လက်ရှိတည်နေရာ</button>
        </div>
      </div>
    </div>
    <!-- Results -->
    <div id="resultsSection" style="margin-top: 2rem; display: none;">
      <h3 style="font-family: var(--font-heading); color: var(--green-dark); margin-bottom: 1rem;">🤖 AI အကြံပြုထားသော
        ခရီးစဉ်များ</h3>
      <div id="resultsList" style="display: flex; flex-direction: column; gap: 1rem;"></div>
    </div>
  </div>
  <!-- Booking Modal -->
  <div id="bookingModal" class="modal">
    <div class="modal-content">
      <h3 id="modalTitle" style="color: var(--green); margin-bottom: 1rem;">✅ ခရီးစဉ် အတည်ပြုရန်</h3>
      <p id="modalMessage"></p>
      <div class="modal-actions">
        <button onclick="confirmBooking()" class="btn-primary">အတည်ပြုမည်</button>
        <button onclick="closeBookingModal()" class="btn-outline">မယ်တော့ဘူး</button>
      </div>
    </div>
  </div>
  <script type="module">
    import { requireAuth, getCurrentUser, logout } from '../js/auth.js';
    import { db } from '../js/database.js';

    if (!requireAuth()) {
      /* redirect handled */
    } else {
      let currentSelectedRide = null;
      let map = null;
      let startMarker = null;
      let endMarker = null;
      let focusedInput = null; // Track which input is focused: 'start' or 'end'

      const startInput = document.getElementById('startLocation');
      const endInput = document.getElementById('endLocation');

      // Track input focus
      startInput.addEventListener('focus', () => {
        focusedInput = 'start';
        showMapClickHint('ထွက်ခွာမည့်နေရာ ရွေးရန် မြေပုံပေါ်တွင် နှိပ်ပါ');
      });
      endInput.addEventListener('focus', () => {
        focusedInput = 'end';
        showMapClickHint('ဦးတည်ရာ ရွေးရန် မြေပုံပေါ်တွင် နှိပ်ပါ');
      });

      function showMapClickHint(text) {
        const hint = document.getElementById('mapClickHint');
        const hintText = document.getElementById('mapClickHintText');
        hintText.textContent = text;
        hint.style.opacity = '1';
        hint.style.transform = 'translateY(0)';
      }

      function hideMapClickHint() {
        const hint = document.getElementById('mapClickHint');
        hint.style.opacity = '0';
        hint.style.transform = 'translateY(-4px)';
      }

      // Reverse geocode (coordinates → address)
      async function reverseGeocode(lat, lng) {
        const url = `https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&zoom=16&addressdetails=1`;
        try {
          const response = await fetch(url);
          const data = await response.json();
          if (data && data.display_name) {
            const parts = data.display_name.split(',');
            return parts.slice(0, 3).join(',').trim();
          }
        } catch (error) {
          console.error('Reverse geocoding error:', error);
        }
        return `${lat.toFixed(5)}, ${lng.toFixed(5)}`;
      }

      // Initialize map
      function initMap() {
        const yangon = [16.8661, 96.1951];
        map = L.map('map').setView(yangon, 12);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
          attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        // Map click → auto-fill focused input
        map.on('click', async (e) => {
          if (!focusedInput) return;

          const { lat, lng } = e.latlng;
          const currentType = focusedInput; // Save current state before focus changes

          // Place marker immediately for responsiveness
          if (currentType === 'start') {
            if (startMarker) map.removeLayer(startMarker);
            startMarker = L.marker([lat, lng]).addTo(map).bindPopup('Loading...').openPopup();
          } else {
            if (endMarker) map.removeLayer(endMarker);
            endMarker = L.marker([lat, lng]).addTo(map).bindPopup('Loading...').openPopup();
          }

          // Reverse geocode
          const address = await reverseGeocode(lat, lng);

          // Fill the focused input
          if (currentType === 'start') {
            startInput.value = address;
            startMarker.setPopupContent(`Start: ${address}`).openPopup();
            // Auto-advance focus securely
            endInput.focus();
          } else {
            endInput.value = address;
            endMarker.setPopupContent(`End: ${address}`).openPopup();
            focusedInput = null; // Reset focus track
            hideMapClickHint();
          }

          // Fit bounds if both markers exist
          if (startMarker && endMarker) {
            const bounds = L.latLngBounds(startMarker.getLatLng(), endMarker.getLatLng());
            map.fitBounds(bounds, { padding: [50, 50] });
          }
        });
      }

      // Geocode address
      async function geocodeAddress(address) {
        const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(address + ', Yangon, Myanmar')}`;
        try {
          const response = await fetch(url);
          const data = await response.json();
          if (data && data.length > 0) {
            return {
              lat: parseFloat(data[0].lat),
              lng: parseFloat(data[0].lon),
              displayName: data[0].display_name
            };
          }
        } catch (error) {
          console.error('Geocoding error:', error);
        }
        return null;
      }

      // Show location on map
      async function showLocation(address, type) {
        const coords = await geocodeAddress(address);
        if (coords) {
          if (type === 'start') {
            if (startMarker) map.removeLayer(startMarker);
            startMarker = L.marker([coords.lat, coords.lng]).addTo(map).bindPopup(`Start: ${address}`).openPopup();
          } else {
            if (endMarker) map.removeLayer(endMarker);
            endMarker = L.marker([coords.lat, coords.lng]).addTo(map).bindPopup(`End: ${address}`).openPopup();
          }
          if (startMarker && endMarker) {
            const bounds = L.latLngBounds(startMarker.getLatLng(), endMarker.getLatLng());
            map.fitBounds(bounds, { padding: [50, 50] });
          } else if (startMarker) {
            map.setView(startMarker.getLatLng(), 14);
          }
          return coords;
        }
        return null;
      }

      // Search for rides
      document.getElementById('searchForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const startLocation = startInput.value;
        const endLocation = endInput.value;
        const departureTime = document.getElementById('departureTime').value;

        await showLocation(startLocation, 'start');
        await showLocation(endLocation, 'end');

        const matches = db.findMatchingRides(startLocation, endLocation, departureTime);
        const resultsDiv = document.getElementById('resultsSection');
        const resultsList = document.getElementById('resultsList');

        if (matches.length === 0) {
          resultsList.innerHTML = `
          <div class="glass-card" style="text-align: center; padding: 3rem;">
            <div style="font-size: 3rem; margin-bottom: 1rem;">🔍</div>
            <h3 style="color: var(--green-dark);">လမ်းကြောင်းတူ ခရီးစဉ်မရှိသေးပါ</h3>
            <p style="color: var(--gray);">သင့်အနေနဲ့ ကားမောင်းသူအဖြစ် စာရင်းပေးသွင်းနိုင်ပါတယ်</p>
            <a href="offer-ride.html" class="btn-primary" style="margin-top: 1rem; display: inline-block;">ကားမောင်းမည်</a>
          </div>
        `;
        } else {
          resultsList.innerHTML = matches.map(match => `
          <div class="glass-card data-ride-card" style="cursor: pointer;" data-id="${match.id}">
            <div style="display: flex; justify-content: space-between; align-items: start; flex-wrap: wrap; gap: 1rem;">
              <div>
                <div style="display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.5rem;">
                  <span class="badge">Match ${match.matchScore}%</span>
                  <span class="badge">🚗 ${match.totalPassengers} ဦးစီး</span>
                </div>
                <h3 style="font-family: var(--font-heading); color: var(--green-dark);">
                  ${match.startLocation} → ${match.endLocation}
                </h3>
                <p style="color: var(--gray); font-size: 0.85rem;">
                  📅 ${new Date(match.departureTime).toLocaleString()}
                </p>
              </div>
              <div style="text-align: right;">
                <div style="font-size: 0.7rem; color: var(--gray); text-decoration: line-through;">${match.originalPrice.toLocaleString()} ကျပ်</div>
                <div style="font-family: var(--font-heading); font-size: 1.5rem; font-weight: 800; color: var(--green);">
                  ${match.discountedPrice.toLocaleString()} ကျပ်
                </div>
                <div style="font-size: 0.7rem; color: var(--green);">${match.savings.toLocaleString()} ကျပ် သက်သာ (${Math.round((match.savings / match.originalPrice) * 100)}%)</div>
              </div>
            </div>
            <button class="btn-primary select-ride-btn" style="margin-top: 1rem; width: 100%;" data-id="${match.id}">
              ဤခရီးစဉ်ကို ရွေးမည်
            </button>
          </div>
        `).join('');

          // Clean modern event delegation instead of window breaking strings
          resultsList.querySelectorAll('.data-ride-card').forEach(card => {
            card.addEventListener('click', () => selectRide(card.dataset.id));
          });
          resultsList.querySelectorAll('.select-ride-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
              e.stopPropagation();
              selectRide(btn.dataset.id);
            });
          });
        }
        resultsDiv.style.display = 'block';
        resultsDiv.scrollIntoView({ behavior: 'smooth' });
      });

      // Select ride logic
      function selectRide(rideId) {
        const rides = db.getRides();
        currentSelectedRide = rides.find(r => r.id === rideId);
        const user = getCurrentUser();
        const modal = document.getElementById('bookingModal');
        const modalMessage = document.getElementById('modalMessage');
        modalMessage.innerHTML = `
        <div style="margin: 1rem 0;">
          <p><strong>${currentSelectedRide.startLocation}</strong> မှ <strong>${currentSelectedRide.endLocation}</strong> သို့</p>
          <p>ခရီးစရိတ်: <strong style="color: var(--green); font-size: 1.25rem;">${currentSelectedRide.discountedPrice || 2500} ကျပ်</strong></p>
          <p>လက်ကျန်ငွေ: <strong>${user.balance.toLocaleString()} ကျပ်</strong></p>
          ${user.balance < (currentSelectedRide.discountedPrice || 2500) ?
            '<p style="color: #dc2626;">⚠️ လက်ကျန်ငွေ မလုံလောက်ပါ။ ကျေးဇူးပြု၍ Ngwe Phayt Par။</p>' : ''}
        </div>
      `;
        modal.style.display = 'flex';
      }

      // Attach globals safely for standard HTML buttons that call them outside the layout
      window.confirmBooking = function () {
        const user = getCurrentUser();
        const price = currentSelectedRide.discountedPrice || 2500;
        if (user.balance < price) {
          alert('လက်ကျန်ငွေ မလုံလောက်ပါ။ ကျေးဇူးပြု၍ ငွေဖြည့်ပါ။');
          closeBookingModal();
          return;
        }
        const booking = db.createBooking(currentSelectedRide.id, user.id, 1, price);
        if (booking) {
          alert(`✅ ခရီးစဉ် အတည်ပြုပြီးပါပြီ။\n\nခရီးစရိတ်: ${price.toLocaleString()} ကျပ်\nလက်ကျန်ငွေ: ${(user.balance - price).toLocaleString()} ကျပ်`);
          closeBookingModal();
          window.location.href = 'my-rides.html';
        }
      };

      window.closeBookingModal = function () {
        document.getElementById('bookingModal').style.display = 'none';
        currentSelectedRide = null;
      };

      // Get current location
      document.getElementById('getCurrentLocation')?.addEventListener('click', () => {
        if (navigator.geolocation) {
          navigator.geolocation.getCurrentPosition((position) => {
            const lat = position.coords.latitude;
            const lng = position.coords.longitude;
            map.setView([lat, lng], 15);
            L.marker([lat, lng]).addTo(map).bindPopup('Your Location').openPopup();
          });
        }
      });

      // Initialize
      initMap();

      // Default time set to tomorrow
      const tomorrow = new Date();
      tomorrow.setDate(tomorrow.getDate() + 1);
      tomorrow.setHours(8, 30, 0, 0);
      document.getElementById('departureTime').value = tomorrow.toISOString().slice(0, 16);

      document.getElementById('logoutBtn')?.addEventListener('click', (e) => {
        e.preventDefault();
        logout();
      });
    }
  </script>
</body>

</html>
