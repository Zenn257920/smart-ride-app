<!doctype html>
<html lang="my">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wallet - Innovix SmartRide</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div class="bg-grid"></div>
    <div class="bg-glow bg-glow--1"></div>
    <div class="bg-glow bg-glow--2"></div>
    <nav class="nav-wrapper">
      <div class="nav-inner">
        <a href="/" class="logo">
          <div class="logo-icon">
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="#fff"
              stroke-width="2"
            >
              <rect x="1" y="3" width="15" height="13" rx="2" />
              <path d="M16 8h4l3 4v4h-7V8z" />
              <circle cx="5.5" cy="18.5" r="2.5" />
              <circle cx="18.5" cy="18.5" r="2.5" />
            </svg>
          </div>
          <div>
            <span class="logo-text">Innovix SmartRide</span>
            <span class="logo-sub">Myanmar</span>
          </div>
        </a>
        <div class="nav-links">
          <a href="find-ride.html" class="nav-link">ကားစီးမည်</a>
          <a href="offer-ride.html" class="nav-link">ကားမောင်းမည်</a>
          <a href="dashboard.html" class="nav-link">Dashboard</a>
          <a href="#" id="logoutBtn" class="nav-link">ထွက်ရန်</a>
        </div>
      </div>
    </nav>
    <div class="container" style="padding: 2rem">
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 2rem">
        <!-- Balance Card -->
        <div class="glass-card animate-fade-in-up">
          <h3
            style="
              font-family: var(--font-heading);
              color: var(--green-dark);
              margin-bottom: 1rem;
            "
          >
            💰 လက်ကျန်ငွေ
          </h3>
          <div style="text-align: center; padding: 1.5rem">
            <div
              style="
                font-family: var(--font-heading);
                font-size: 3rem;
                font-weight: 800;
                color: var(--green);
              "
              id="balance"
            >
              0
            </div>
            <div style="font-size: 0.8rem; color: var(--gray)">ကျပ် (MMK)</div>
          </div>
          <div style="display: flex; gap: 1rem">
            <button id="topupBtn" class="btn-primary" style="flex: 1">
              ငွေဖြည့်မည်
            </button>
            <button id="withdrawBtn" class="btn-outline" style="flex: 1">
              ငွေထုတ်မည်
            </button>
          </div>
        </div>
        <!-- Quick Actions -->
        <div class="glass-card animate-fade-in-up animate-delay-2">
          <h3
            style="
              font-family: var(--font-heading);
              color: var(--green-dark);
              margin-bottom: 1rem;
            "
          >
            ⚡ အမြန်လုပ်ဆောင်ချက်များ
          </h3>
          <div style="display: flex; flex-direction: column; gap: 0.75rem">
            <a
              href="find-ride.html"
              class="btn-outline"
              style="text-align: center"
              >🔍 ခရီးစဉ်ရှာမည်</a
            >
            <a
              href="offer-ride.html"
              class="btn-outline"
              style="text-align: center"
              >🚙 ခရီးစဉ်ကမ်းလှမ်းမည်</a
            >
            <a
              href="my-rides.html"
              class="btn-outline"
              style="text-align: center"
              >📋 ခရီးစဉ်မှတ်တမ်း</a
            >
          </div>
        </div>
      </div>
      <!-- Transaction History -->
      <div
        class="glass-card animate-fade-in-up animate-delay-3"
        style="margin-top: 2rem"
      >
        <h3
          style="
            font-family: var(--font-heading);
            color: var(--green-dark);
            margin-bottom: 1rem;
          "
        >
          📊 ငွေလွှဲမှတ်တမ်း
        </h3>
        <div id="transactionsList"></div>
      </div>
    </div>
    <!-- Topup Modal -->
    <div id="topupModal" class="modal">
      <div class="modal-content">
        <h3 style="color: var(--green); margin-bottom: 1rem">💰 ငွေဖြည့်မည်</h3>
        <div class="input-group">
          <label class="input-label">ငွေပမာဏ (ကျပ်)</label>
          <input
            type="number"
            id="topupAmount"
            class="input-field"
            placeholder="e.g. 10000"
            min="1000"
            step="1000"
          />
        </div>
        <div style="display: flex; gap: 0.5rem; margin: 1rem 0">
          <button
            onclick="setAmount(10000)"
            class="btn-outline"
            style="flex: 1"
          >
            10,000
          </button>
          <button
            onclick="setAmount(25000)"
            class="btn-outline"
            style="flex: 1"
          >
            25,000
          </button>
          <button
            onclick="setAmount(50000)"
            class="btn-outline"
            style="flex: 1"
          >
            50,000
          </button>
          <button
            onclick="setAmount(100000)"
            class="btn-outline"
            style="flex: 1"
          >
            100,000
          </button>
        </div>
        <div class="modal-actions">
          <button onclick="confirmTopup()" class="btn-primary" style="flex: 1">
            အတည်ပြုမည်
          </button>
          <button
            onclick="closeTopupModal()"
            class="btn-outline"
            style="flex: 1"
          >
            ပိတ်ရန်
          </button>
        </div>
      </div>
    </div>
    <!-- Withdraw Modal -->
    <div id="withdrawModal" class="modal">
      <div class="modal-content">
        <h3 style="color: var(--amber); margin-bottom: 1rem">💸 ငွေထုတ်မည်</h3>
        <div class="input-group">
          <label class="input-label">ငွေပမာဏ (ကျပ်)</label>
          <input
            type="number"
            id="withdrawAmount"
            class="input-field"
            placeholder="e.g. 5000"
            min="1000"
            step="1000"
          />
        </div>
        <div class="modal-actions">
          <button
            onclick="confirmWithdraw()"
            class="btn-primary"
            style="flex: 1"
          >
            အတည်ပြုမည်
          </button>
          <button
            onclick="closeWithdrawModal()"
            class="btn-outline"
            style="flex: 1"
          >
            ပိတ်ရန်
          </button>
        </div>
      </div>
    </div>
    <script type="module">
      import { requireAuth, getCurrentUser, logout } from "../js/auth.js";
      import { db } from "../js/database.js";
      if (!requireAuth()) {
        /* redirect handled */
      } else {
        let currentUser = getCurrentUser();
        function updateUI() {
          document.getElementById("balance").textContent =
            currentUser.balance?.toLocaleString() || "0";
        }
        function loadTransactions() {
          const transactions = db.getTransactionsByUser(currentUser.id);
          if (transactions.length === 0) {
            document.getElementById("transactionsList").innerHTML = `
            <div style="text-align: center; padding: 2rem;">
              <p style="color: var(--gray);">ငွေလွှဲမှတ်တမ်း မရှိသေးပါ</p>
            </div>
          `;
            return;
          }
          document.getElementById("transactionsList").innerHTML = transactions
            .map(
              (tx) => `
          <div class="glass-card" style="margin-bottom: 0.75rem; padding: 0.75rem;">
            <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.5rem;">
              <div>
                <div style="display: flex; align-items: center; gap: 0.5rem;">
                  <span class="badge" style="background: ${tx.amount > 0 ? "var(--green-light)" : "#fee2e2"}; color: ${tx.amount > 0 ? "var(--green)" : "#dc2626"};">
                    ${tx.amount > 0 ? "➕ ငွေသွင်း" : "➖ ငွေထုတ်"}
                  </span>
                  <span style="font-size: 0.7rem; color: var(--gray);">${new Date(tx.createdAt).toLocaleString()}</span>
                </div>
                <p style="font-size: 0.8rem; color: var(--gray); margin-top: 0.25rem;">${tx.description}</p>
              </div>
              <div style="font-family: var(--font-heading); font-size: 1.25rem; font-weight: 700; color: ${tx.amount > 0 ? "var(--green)" : "#dc2626"};">
                ${tx.amount > 0 ? "+" : ""}${tx.amount.toLocaleString()} ကျပ်
              </div>
            </div>
          </div>
        `,
            )
            .join("");
        }
        window.setAmount = function (amount) {
          document.getElementById("topupAmount").value = amount;
        };
        window.confirmTopup = function () {
          const amount = parseInt(document.getElementById("topupAmount").value);
          if (!amount || amount < 1000) {
            alert("ကျေးဇူးပြု၍ အနည်းဆုံး 1,000 ကျပ် ထည့်ပါ");
            return;
          }
          const newBalance = db.updateBalance(
            currentUser.id,
            amount,
            `ငွေသွင်း ${amount.toLocaleString()} ကျပ်`,
          );
          currentUser = getCurrentUser();
          updateUI();
          loadTransactions();
          closeTopupModal();
          alert(
            `✅ ငွေသွင်းပြီးပါပြီ။\nလက်ကျန်ငွေ: ${newBalance.toLocaleString()} ကျပ်`,
          );
        };
        window.confirmWithdraw = function () {
          const amount = parseInt(
            document.getElementById("withdrawAmount").value,
          );
          if (!amount || amount < 1000) {
            alert("ကျေးဇူးပြု၍ အနည်းဆုံး 1,000 ကျပ် ထည့်ပါ");
            return;
          }
          if (amount > currentUser.balance) {
            alert("လက်ကျန်ငွေ မလုံလောက်ပါ");
            return;
          }
          const newBalance = db.updateBalance(
            currentUser.id,
            -amount,
            `ငွေထုတ် ${amount.toLocaleString()} ကျပ်`,
          );
          currentUser = getCurrentUser();
          updateUI();
          loadTransactions();
          closeWithdrawModal();
          alert(
            `✅ ငွေထုတ်ပြီးပါပြီ။\nလက်ကျန်ငွေ: ${newBalance.toLocaleString()} ကျပ်`,
          );
        };
        window.closeTopupModal = function () {
          document.getElementById("topupModal").style.display = "none";
          document.getElementById("topupAmount").value = "";
        };
        window.closeWithdrawModal = function () {
          document.getElementById("withdrawModal").style.display = "none";
          document.getElementById("withdrawAmount").value = "";
        };
        document.getElementById("topupBtn").addEventListener("click", () => {
          document.getElementById("topupModal").style.display = "flex";
        });
        document.getElementById("withdrawBtn").addEventListener("click", () => {
          document.getElementById("withdrawModal").style.display = "flex";
        });
        document.getElementById("logoutBtn")?.addEventListener("click", (e) => {
          e.preventDefault();
          logout();
        });
        // Initialize
        updateUI();
        loadTransactions();
      } // end auth guard
    </script>
  </body>
</html>
